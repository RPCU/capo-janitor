name: Update upstream
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  # Pushes made with GITHUB_TOKEN don't trigger other workflows, so the
  # build/push workflow is dispatched explicitly after a bump.
  actions: write
concurrency:
  group: update-upstream
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Update pins
        id: pins
        run: |
          nix run nixpkgs#npins -- update
          if git diff --quiet npins/sources.json; then
            echo "No upstream changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Update vendorHash
        if: steps.pins.outputs.changed == 'true'
        run: |
          if out=$(nix-build nix -A manager --no-out-link 2>&1); then
            echo "vendorHash still valid."
            exit 0
          fi
          NEW=$(echo "$out" | grep -oP 'got:\s+\Ksha256-\S+' | head -1)
          if [ -z "$NEW" ]; then
            echo "$out"
            exit 1
          fi
          OLD=$(grep -oP 'vendorHash = "\K[^"]+' nix/default.nix)
          sed -i "s|$OLD|$NEW|" nix/default.nix
          nix-build nix -A manager --no-out-link
      - name: Commit and push
        if: steps.pins.outputs.changed == 'true'
        run: |
          REV=$(jq -r '.pins["capi-janitor-openstack-go"].revision' npins/sources.json)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add npins/sources.json nix/default.nix
          git commit -m "chore: bump upstream capi-janitor-openstack-go to ${REV}"
          git push
      - name: Trigger build & push
        if: steps.pins.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run push.yaml --ref main
