name: Update upstream
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Install npins
        run: nix profile install nixpkgs#npins
      - name: Update pins
        run: npins update
      - name: Commit and push if changed
        run: |
          if git diff --quiet npins/sources.json; then
            echo "No upstream changes."
            exit 0
          fi
          REV=$(jq -r '.pins["capi-janitor-openstack-go"].revision' npins/sources.json)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add npins/sources.json
          git commit -m "chore: bump upstream capi-janitor-openstack-go to ${REV}"
          git push
