name: Build & Push
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  buildpush:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: warjiang/setup-skopeo@main
        with:
          version: latest
      - name: Build and push OCI image
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          $(nix-build nix -A image) > oci.tar
          IMAGE_FULLNAME=$(tar -axf oci.tar manifest.json -O | jq -r '.[0].RepoTags[0]')
          skopeo copy --insecure-policy --dest-creds \
            "$REGISTRY_USER:$REGISTRY_PASSWORD" \
            docker-archive:oci.tar \
            docker://"$IMAGE_FULLNAME"

          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          skopeo copy --insecure-policy --dest-creds \
            "$REGISTRY_USER:$REGISTRY_PASSWORD" \
            docker-archive:oci.tar \
            docker://zot.rpcu.io/public/capi-janitor-openstack-go:"$SHORT_SHA"

          UPSTREAM_REV=$(grep 'upstreamRev' nix/default.nix | sed 's/.*"\(.*\)".*/\1/')
          TAGS=$(curl -sf "https://api.github.com/repos/azimuth-cloud/capi-janitor-openstack-go/git/commits/$UPSTREAM_REV/refs/tags" | jq -r '.[].ref' | sed 's|refs/tags/||' || true)
          for TAG in $TAGS; do
            skopeo copy --insecure-policy --dest-creds \
              "$REGISTRY_USER:$REGISTRY_PASSWORD" \
              docker-archive:oci.tar \
              docker://zot.rpcu.io/public/capi-janitor-openstack-go:"$TAG"
          done
