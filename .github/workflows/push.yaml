name: Build & Push
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  buildpush:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: warjiang/setup-skopeo@main
        with:
          version: latest
      - name: Build and push OCI image
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          nix-build nix -A image -o oci-link
          # buildLayeredImage produces a gzipped tar; skopeo's docker-archive
          # transport needs an uncompressed tar.
          gzip -dc oci-link > oci.tar
          IMAGE_FULLNAME=$(tar -xf oci.tar manifest.json -O | jq -r '.[0].RepoTags[0]')
          skopeo copy --insecure-policy --dest-creds \
            "$REGISTRY_USER:$REGISTRY_PASSWORD" \
            docker-archive:oci.tar \
            docker://"$IMAGE_FULLNAME"

          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          skopeo copy --insecure-policy --dest-creds \
            "$REGISTRY_USER:$REGISTRY_PASSWORD" \
            docker-archive:oci.tar \
            docker://zot.rpcu.io/public/capi-janitor-openstack-go:"$SHORT_SHA"

          UPSTREAM_REV=$(jq -r '.pins["capi-janitor-openstack-go"].revision' npins/sources.json)
          # Upstream tags pointing at the pinned commit (annotated tags show up as "^{}").
          TAGS=$(git ls-remote --tags https://github.com/azimuth-cloud/capi-janitor-openstack-go \
            | awk -v rev="$UPSTREAM_REV" '$1 == rev { sub("refs/tags/", "", $2); sub(/\^\{\}$/, "", $2); print $2 }' \
            | sort -u)
          for TAG in $TAGS; do
            skopeo copy --insecure-policy --dest-creds \
              "$REGISTRY_USER:$REGISTRY_PASSWORD" \
              docker-archive:oci.tar \
              docker://zot.rpcu.io/public/capi-janitor-openstack-go:"$TAG"
          done
